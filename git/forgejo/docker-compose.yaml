networks:
  forgejo:
    external: false

services:
  docker-in-docker:
    image: docker:dind
    container_name: 'docker_dind'
    networks:
      - forgejo
    privileged: 'true'
    command: ['dockerd', '-H', 'tcp://0.0.0.0:2375', '--tls=false']
    restart: 'unless-stopped'

  server:
    #image: codeberg.org/forgejo/forgejo:13
    build:
      dockerfile: forgejo.Dockerfile
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=$PG_DBNAME
      - FORGEJO__database__USER=$PG_USER
      - FORGEJO__database__PASSWD=$PG_PASSWORD
    restart: always
    networks:
      - forgejo
    volumes:
      - ./forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=$PG_USER
      - POSTGRES_PASSWORD=$PG_PASSWORD
      - POSTGRES_DB=$PG_DBNAME
    networks:
      - forgejo
    volumes:
      - ./postgres:/var/lib/postgresql/data

  runner:
    image: 'data.forgejo.org/forgejo/runner:11'
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
    container_name: 'runner'
    networks:
      - forgejo
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    # User without root privileges, but with access to `./data`.
    user: 1001:1001
    volumes:
      - ./runner/data:/data
    restart: 'unless-stopped'
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config config.yml"'
    #command: '/bin/sh -c "while : ; do sleep 1 ; done ;"'